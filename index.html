<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f7f4ee"><title>Morrow | The first year, beautifully kept.</title><meta name="description" content="Morrow is a private place for the photographs, firsts and little moments that make a baby's first year uniquely theirs."><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=Playfair+Display:wght@500;600&display=swap" rel="stylesheet"><style>
:root{--ink:#201d1a;--muted:#746f67;--paper:#f7f4ee;--card:#fffdf9;--sage:#aeb9a5;--sage-dark:#64715e;--clay:#c8a58f;--line:#e5dfd5;--shadow:0 18px 50px rgba(42,35,28,.07);--radius:24px}*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--paper);color:var(--ink);font-family:'DM Sans',system-ui,sans-serif;font-size:15px;line-height:1.55}button,input,textarea,select{font:inherit}button{cursor:pointer}.serif{font-family:'Playfair Display',Georgia,serif}.app{min-height:100vh}.shell{max-width:1180px;margin:auto;padding:0 28px}.topbar{height:78px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line);position:sticky;top:0;background:rgba(247,244,238,.93);backdrop-filter:blur(14px);z-index:10}.brand{font-family:'Playfair Display',Georgia,serif;font-size:25px;letter-spacing:-.03em}.brand span{color:var(--sage-dark)}.nav{display:flex;gap:5px}.nav button,.bottomnav button{border:0;background:transparent;color:var(--muted);padding:10px 13px;border-radius:999px}.nav button.active,.nav button:hover{background:#ebe8df;color:var(--ink)}.top-actions{display:flex;align-items:center;gap:10px}.iconbtn{width:40px;height:40px;border:1px solid var(--line);background:var(--card);border-radius:50%}.primary{background:var(--ink);color:#fff;border:0;border-radius:999px;padding:12px 18px;font-weight:600;box-shadow:0 7px 20px rgba(32,29,26,.12)}.secondary{background:transparent;color:var(--ink);border:1px solid var(--line);border-radius:999px;padding:11px 17px;font-weight:600}.main{padding:44px 0 100px}.hero{display:grid;grid-template-columns:1.4fr .8fr;gap:28px;align-items:stretch}.hero-copy{padding:28px 4px}.eyebrow{text-transform:uppercase;letter-spacing:.14em;font-size:11px;font-weight:600;color:var(--sage-dark)}h1{font-size:clamp(42px,6vw,76px);line-height:1.02;letter-spacing:-.055em;margin:14px 0 20px;font-weight:500}h2{font-family:'Playfair Display',Georgia,serif;font-weight:500;letter-spacing:-.035em;font-size:36px;line-height:1.1;margin:0 0 10px}.lead{font-size:18px;color:var(--muted);max-width:620px}.hero-actions{display:flex;gap:10px;margin-top:28px;flex-wrap:wrap}.identity{background:#e4e9df;border-radius:30px;min-height:340px;padding:25px;display:flex;flex-direction:column;justify-content:space-between;position:relative;overflow:hidden}.identity:after{content:'';position:absolute;width:230px;height:230px;border-radius:50%;right:-80px;bottom:-90px;background:rgba(255,255,255,.36)}.avatar{width:76px;height:76px;border-radius:50%;background:#d5c7b9;display:grid;place-items:center;font-family:'Playfair Display';font-size:30px;overflow:hidden}.avatar img,.photo img{width:100%;height:100%;object-fit:cover}.identity .name{font-family:'Playfair Display';font-size:30px}.section{margin-top:58px}.section-head{display:flex;align-items:end;justify-content:space-between;margin-bottom:18px}.section-head p{color:var(--muted);margin:0}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:22px;box-shadow:0 8px 30px rgba(42,35,28,.025)}.stat{min-height:125px}.stat strong{display:block;font-family:'Playfair Display';font-size:38px;font-weight:500}.stat span{color:var(--muted)}.capture-card{background:var(--ink);color:#fff;display:flex;justify-content:space-between;align-items:center;gap:20px;padding:25px 28px;border-radius:var(--radius)}.capture-card p{color:#c9c4bc;margin:5px 0 0}.capture-card button{background:#fff;color:var(--ink)}.prompt{background:#e7ece2}.prompt .quote{font-family:'Playfair Display';font-size:24px;line-height:1.25;margin:14px 0}.memory-list{display:grid;gap:12px}.memory{display:grid;grid-template-columns:82px 1fr auto;gap:18px;align-items:center}.thumb{width:82px;height:82px;border-radius:17px;background:#e8e1d8;overflow:hidden;display:grid;place-items:center;color:var(--muted)}.memory h3{margin:0 0 4px;font-family:'Playfair Display';font-weight:500;font-size:22px}.meta{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}.memory p{margin:5px 0 0;color:var(--muted);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}.timeline{position:relative}.month{padding-left:28px;border-left:1px solid #d8d1c6;margin-left:7px;margin-bottom:42px}.month-title{position:relative}.month-title:before{content:'';position:absolute;left:-34px;top:9px;width:10px;height:10px;border-radius:50%;background:var(--sage-dark);box-shadow:0 0 0 6px var(--paper)}.month h2{font-size:29px}.month-count{color:var(--muted);font-size:13px}.firsts{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.first{min-height:145px;background:var(--card);border:1px solid var(--line);border-radius:20px;padding:18px}.first.done{background:#e8ede4}.first .symbol{font-size:20px;margin-bottom:18px}.first strong{display:block;font-family:'Playfair Display';font-size:19px;font-weight:500}.first small{color:var(--muted)}.empty{text-align:center;padding:50px 20px;color:var(--muted);border:1px dashed #d8d1c6;border-radius:20px}.book{background:#ebe5db;border-radius:28px;padding:26px;display:grid;grid-template-columns:1fr 1fr;gap:18px}.book-cover{background:#f7f2e8;min-height:310px;border-radius:4px;padding:30px;display:flex;flex-direction:column;justify-content:space-between;box-shadow:var(--shadow)}.book-cover .title{font-family:'Playfair Display';font-size:42px;line-height:1.05}.book-cover .tiny{text-transform:uppercase;letter-spacing:.15em;font-size:10px;color:var(--muted)}.book-copy{padding:20px}.book-copy p{color:var(--muted)}.footer{border-top:1px solid var(--line);padding:35px 0;color:var(--muted);font-size:13px;display:flex;justify-content:space-between}.bottomnav{display:none}.modal{position:fixed;inset:0;background:rgba(25,22,19,.38);display:none;align-items:end;justify-content:center;z-index:50}.modal.open{display:flex}.sheet{background:var(--paper);width:min(720px,100%);border-radius:28px 28px 0 0;padding:25px;max-height:92vh;overflow:auto}.sheet-head{display:flex;justify-content:space-between;align-items:center}.close{border:0;background:#ebe7df;width:38px;height:38px;border-radius:50%}.types{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin:18px 0}.type{padding:14px;border:1px solid var(--line);background:var(--card);border-radius:15px;text-align:left}.type.selected{border-color:var(--sage-dark);background:#e8ede4}.field{margin:14px 0}.field label{display:block;font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin-bottom:6px}.field input,.field textarea,.field select{width:100%;border:1px solid var(--line);background:var(--card);border-radius:14px;padding:12px 13px;outline:none}.field textarea{min-height:120px;resize:vertical}.form-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}.toast{position:fixed;bottom:25px;left:50%;transform:translateX(-50%) translateY(20px);opacity:0;background:var(--ink);color:#fff;padding:11px 16px;border-radius:999px;font-size:13px;transition:.25s;z-index:80}.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}.setup{min-height:100vh;display:grid;place-items:center;padding:24px}.setup-card{width:min(650px,100%);background:var(--card);border:1px solid var(--line);border-radius:30px;padding:40px;box-shadow:var(--shadow)}.setup-card h1{font-size:50px}.hidden{display:none!important}@media(max-width:850px){.shell{padding:0 18px}.topbar{height:68px}.nav{display:none}.top-actions .secondary{display:none}.hero{grid-template-columns:1fr}.identity{min-height:240px}.grid{grid-template-columns:1fr 1fr}.firsts{grid-template-columns:1fr 1fr}.book{grid-template-columns:1fr}.bottomnav{position:fixed;display:flex;bottom:0;left:0;right:0;height:70px;background:rgba(255,253,249,.96);backdrop-filter:blur(16px);border-top:1px solid var(--line);z-index:20;justify-content:space-around;padding-bottom:env(safe-area-inset-bottom)}.bottomnav button{font-size:11px;display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 10px}.main{padding-top:25px}.memory{grid-template-columns:62px 1fr}.thumb{width:62px;height:62px}.memory .secondary{display:none}.capture-card{align-items:flex-start;flex-direction:column}.footer{padding-bottom:90px}.types{grid-template-columns:1fr 1fr}h1{font-size:48px}}
</style></head><body><div id="app"></div><div class="modal" id="captureModal"><div class="sheet"><div class="sheet-head"><div><div class="eyebrow">Keep a moment</div><h2>What would you like to keep?</h2></div><button class="close" onclick="closeCapture()">×</button></div><div class="types" id="types"></div><div class="field"><label>Date</label><input id="mDate" type="date"></div><div class="field"><label>Title</label><input id="mTitle" placeholder="A little laugh at the kitchen table"></div><div class="field"><label>Your memory</label><textarea id="mBody" placeholder="Write it as you remember it. A sentence is enough."></textarea></div><div class="field"><label>Photo, optional</label><input id="mPhoto" type="file" accept="image/*"></div><div class="form-actions"><button class="secondary" onclick="closeCapture()">Cancel</button><button class="primary" onclick="saveMemory()">Keep this moment</button></div></div></div><div class="toast" id="toast"></div><script>
const KEY='morrow_gold_v6';const types=[['moment','A moment','The everyday things worth remembering.'],['photo','Photograph','Give a favourite photograph a place in the story.'],['first','A first','The moments that only happen once.'],['love','Something they love','The people, places and things they adore.'],['said','Something they said','Their little words and funny phrases.'],['milestone','Milestone','A moment of change or growing.']];let state=JSON.parse(localStorage.getItem(KEY)||'null')||{setup:false,child:{name:'',dob:'',photo:''},memories:[],firsts:[],letter:'',view:'home'};let selectedType='moment';
const prompts=['What made you laugh together this week?','What is something they do now that you never want to forget?','What sound has become part of your home?','Who made them smile today?','What tiny detail would you miss if you could not remember it?'];
function save(){localStorage.setItem(KEY,JSON.stringify(state))}function esc(s=''){return s.replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}function initials(n){return (n||'').split(' ').map(x=>x[0]).slice(0,2).join('').toUpperCase()||'M'}function fmt(d){if(!d)return '';return new Intl.DateTimeFormat('en-GB',{day:'numeric',month:'long',year:'numeric'}).format(new Date(d+'T12:00:00'))}function monthName(d){return new Intl.DateTimeFormat('en-GB',{month:'long',year:'numeric'}).format(new Date(d+'T12:00:00'))}
function setup(){app.innerHTML=`<div class="setup"><div class="setup-card"><div class="eyebrow">Morrow</div><h1 class="serif">Let’s begin their story.</h1><p class="lead">A private place for the photographs, firsts and little moments that make their first year uniquely theirs.</p><div class="field"><label>Their name</label><input id="sName" placeholder="e.g. Florence"></div><div class="field"><label>Date they arrived</label><input id="sDob" type="date"></div><div class="field"><label>A photograph, optional</label><input id="sPhoto" type="file" accept="image/*"></div><div class="form-actions"><button class="primary" onclick="finishSetup()">Begin their story</button></div><p style="color:var(--muted);font-size:12px;margin-top:22px">Your prototype keeps everything in this browser. Nothing is uploaded.</p></div></div>`}
function finishSetup(){const n=document.getElementById('sName').value.trim();const dob=document.getElementById('sDob').value;if(!n||!dob){alert('Please add their name and arrival date.');return}state.child.name=n;state.child.dob=dob;state.setup=true;const f=document.getElementById('sPhoto').files[0];if(f){const r=new FileReader();r.onload=()=>{state.child.photo=r.result;save();render()};r.readAsDataURL(f)}else{save();render()}}
function render(){if(!state.setup){setup();return}const v=state.view||'home';app.innerHTML=`<div class="app"><header class="topbar"><div class="shell" style="display:flex;width:100%;align-items:center;justify-content:space-between"><div class="brand">morrow<span>.</span></div><nav class="nav">${nav('home','Home')}${nav('story','Story')}${nav('firsts','Firsts')}${nav('keepsake','Keepsake')}</nav><div class="top-actions"><button class="secondary" onclick="openCapture()">＋ Capture</button><button class="iconbtn" title="About them" onclick="go('about')">${initials(state.child.name)}</button></div></div></header><main class="main shell">${v==='home'?home():v==='story'?story():v==='firsts'?firsts():v==='keepsake'?keepsake():about()}</main><nav class="bottomnav">${bn('home','⌂','Home')}${bn('story','◌','Story')}${bn('firsts','✦','Firsts')}<button onclick="openCapture()"><b style="font-size:22px;line-height:18px">＋</b><span>Capture</span></button>${bn('keepsake','▢','Book')}</nav><footer class="footer shell"><span>morrow. · The first year, beautifully kept.</span><span>Private by design · Prototype</span></footer></div>`}
function nav(x,label){return `<button class="${state.view===x?'active':''}" onclick="go('${x}')">${label}</button>`}function bn(x,i,label){return `<button class="${state.view===x?'active':''}" onclick="go('${x}')"><b>${i}</b><span>${label}</span></button>`}function go(v){state.view=v;save();render();scrollTo(0,0)}
function home(){const ms=[...state.memories].sort((a,b)=>b.date.localeCompare(a.date));return `<section class="hero"><div class="hero-copy"><div class="eyebrow">Your story is growing</div><h1 class="serif">The first year, beautifully kept.</h1><p class="lead">Not a tracker. A story. Keep the photographs, firsts and little moments you will want to remember long after the days have blurred together.</p><div class="hero-actions"><button class="primary" onclick="openCapture()">Capture a moment</button><button class="secondary" onclick="go('story')">Open their story</button></div></div><div class="identity"><div class="avatar">${state.child.photo?`<img src="${state.child.photo}" alt="">`:initials(state.child.name)}</div><div><div class="eyebrow">Their story</div><div class="name">${esc(state.child.name)}</div><div style="color:var(--muted)">${fmt(state.child.dob)}</div></div></div></section><section class="section"><div class="capture-card"><div><strong style="font-family:'Playfair Display';font-size:24px;font-weight:500">Something worth keeping?</strong><p>Capture it now. You can always add the details later.</p></div><button class="primary" onclick="openCapture()">＋ Capture</button></div></section><section class="section"><div class="grid"><div class="card stat"><strong>${state.memories.length}</strong><span>memories kept</span></div><div class="card stat"><strong>${state.memories.filter(x=>x.type==='photo').length}</strong><span>photographs</span></div><div class="card stat"><strong>${state.memories.filter(x=>x.type==='first').length}</strong><span>firsts recorded</span></div></div></section><section class="section"><div class="grid"><div class="card prompt"><div class="eyebrow">A little prompt</div><div class="quote">${prompts[state.memories.length%prompts.length]}</div><button class="secondary" onclick="openCapture('moment',${JSON.stringify(prompts[state.memories.length%prompts.length])})">Keep this thought</button></div><div class="card" style="grid-column:span 2"><div class="section-head"><div><h2>Recently kept</h2><p>The newest pieces of their story.</p></div><button class="secondary" onclick="go('story')">View all</button></div>${ms.length?`<div class="memory-list">${ms.slice(0,3).map(memoryCard).join('')}</div>`:`<div class="empty">Your first memory is waiting here.<br><button class="secondary" style="margin-top:12px" onclick="openCapture()">Keep the first one</button></div>`}</div></div></section>`}
function memoryCard(m){return `<article class="memory"><div class="thumb">${m.photo?`<img src="${m.photo}" alt="">`:m.type==='photo'?'⌁':'✦'}</div><div><div class="meta">${esc(m.type)} · ${fmt(m.date)}</div><h3>${esc(m.title||'Untitled moment')}</h3><p>${esc(m.body||'')}</p></div><button class="secondary" onclick="removeMemory('${m.id}')">Remove</button></article>`}
function story(){const groups={};state.memories.forEach(m=>(groups[monthName(m.date)]??=[]).push(m));const entries=Object.entries(groups).sort((a,b)=>new Date(b[1][0].date)-new Date(a[1][0].date));return `<section class="section" style="margin-top:0"><div class="eyebrow">Their story</div><h1 class="serif" style="font-size:58px">The moments that made this year.</h1><p class="lead">A simple, chronological home for the days you never want to lose.</p><div style="margin:22px 0"><button class="primary" onclick="openCapture()">＋ Capture a moment</button></div></section><section class="section timeline">${entries.length?entries.map(([mo,arr])=>`<div class="month"><div class="month-title"><h2>${esc(mo)}</h2><div class="month-count">${arr.length} ${arr.length===1?'memory':'memories'}</div></div><div class="memory-list" style="margin-top:18px">${arr.sort((a,b)=>b.date.localeCompare(a.date)).map(memoryCard).join('')}</div></div>`).join(''):`<div class="empty">Nothing here yet. Start with one small moment.</div>`}</section>`}
function firsts(){const defaults=['First smile','First proper laugh','First tooth','First steps','First word','First adventure','First favourite toy','First birthday'];return `<section class="section" style="margin-top:0"><div class="eyebrow">Firsts</div><h1 class="serif" style="font-size:58px">The moments that only happen once.</h1><p class="lead">Keep the big firsts, and the ones that only matter to your family.</p></section><section class="section"><div class="firsts">${defaults.map((x,i)=>{const found=state.memories.find(m=>m.type==='first'&&m.title.toLowerCase()===x.toLowerCase());return `<div class="first ${found?'done':''}"><div class="symbol">${found?'✓':'✦'}</div><strong>${x}</strong><small>${found?fmt(found.date):'Not yet recorded'}</small></div>`}).join('')}<button class="first" onclick="openCapture('first')"><div class="symbol">＋</div><strong>Add your own</strong><small>A first only you would think of.</small></button></div></section>`}
function keepsake(){const ms=[...state.memories].sort((a,b)=>a.date.localeCompare(b.date));return `<section class="section" style="margin-top:0"><div class="eyebrow">Keepsake</div><h1 class="serif" style="font-size:58px">Turn their year into something you can hold.</h1><p class="lead">Morrow gathers the story you are already keeping into a beautiful first-year book.</p></section><section class="section"><div class="book"><div class="book-cover"><div class="tiny">Morrow · The first year</div><div class="title">${esc(state.child.name)}<br><em>at one</em></div><div class="tiny">${fmt(state.child.dob)} · ${ms.length} moments kept</div></div><div class="book-copy"><div class="eyebrow">Book preview</div><h2>A year in little moments.</h2><p>Your book grows from the memories you capture. Photographs, firsts, small details and the words you want to keep.</p><div class="card" style="margin:20px 0"><strong style="font-family:'Playfair Display';font-size:22px">${Math.max(24,Math.ceil(ms.length/2)*2+20)} pages</strong><div style="color:var(--muted)">Estimated from your current story</div></div><button class="primary" onclick="window.print()">Preview / save as PDF</button><button class="secondary" style="margin-left:7px" onclick="alert('Print ordering is the next connected product layer. This prototype is ready for that flow.')">Print a book</button></div></div></section>`}
function about(){return `<section class="section" style="margin-top:0"><div class="eyebrow">About them</div><h1 class="serif" style="font-size:58px">${esc(state.child.name)}’s story.</h1><div class="card" style="max-width:650px"><div class="field"><label>Name</label><input id="aName" value="${esc(state.child.name)}"></div><div class="field"><label>Date they arrived</label><input id="aDob" type="date" value="${state.child.dob}"></div><button class="primary" onclick="saveAbout()">Save details</button><button class="secondary" style="margin-left:7px" onclick="backup()">Export backup</button><button class="secondary" style="margin-left:7px" onclick="document.getElementById('restore').click()">Restore</button><input id="restore" class="hidden" type="file" accept="application/json" onchange="restore(event)"></div></section>`}
function saveAbout(){state.child.name=document.getElementById('aName').value.trim()||state.child.name;state.child.dob=document.getElementById('aDob').value||state.child.dob;save();toast('Details saved');render()}function backup(){const b=new Blob([JSON.stringify(state,null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='morrow-backup.json';a.click()}function restore(e){const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{state=JSON.parse(r.result);save();render();toast('Backup restored')}catch{alert('That backup could not be read.')}};r.readAsText(f)}
function openCapture(t='moment',prefill=''){selectedType=t;document.getElementById('captureModal').classList.add('open');document.getElementById('mDate').value=new Date().toISOString().slice(0,10);document.getElementById('mTitle').value='';document.getElementById('mBody').value=prefill;document.getElementById('mPhoto').value='';document.getElementById('types').innerHTML=types.map(([id,n,d])=>`<button class="type ${id===selectedType?'selected':''}" onclick="selectType('${id}')"><strong>${n}</strong><br><small>${d}</small></button>`).join('')}function selectType(t){selectedType=t;document.querySelectorAll('.type').forEach(x=>x.classList.toggle('selected',x.innerText.startsWith(types.find(y=>y[0]===t)[1])))}function closeCapture(){document.getElementById('captureModal').classList.remove('open')}function saveMemory(){const date=document.getElementById('mDate').value,title=document.getElementById('mTitle').value.trim(),body=document.getElementById('mBody').value.trim();if(!date||!title){alert('Please add a date and title.');return}const f=document.getElementById('mPhoto').files[0];const finish=photo=>{state.memories.push({id:Date.now().toString(),date,title,body,type:selectedType,photo:photo||''});save();closeCapture();toast('Moment kept');render()};if(f){const r=new FileReader();r.onload=()=>finish(r.result);r.readAsDataURL(f)}else finish('')}function removeMemory(id){if(!confirm('Remove this memory?'))return;state.memories=state.memories.filter(x=>x.id!==id);save();render();toast('Memory removed')}function toast(s){const t=document.getElementById('toast');t.textContent=s;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),1800)}render();
</script></body></html>
