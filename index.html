</style></head><body><div id="app"></div><div class="modal" id="captureModal"><div class="sheet"><div class="sheet-head"><div><div class="eyebrow">Keep a moment</div><h2>What would you like to keep?</h2></div><button class="close" onclick="closeCapture()">×</button></div><div class="types" id="types"></div><div class="field"><label>Date</label><input id="mDate" type="date"></div><div class="field"><label>Title</label><input id="mTitle" placeholder="A little laugh at the kitchen table"></div><div class="field"><label>Your memory</label><textarea id="mBody" placeholder="Write it as you remember it. A sentence is enough."></textarea></div><div class="field"><label>Photo, optional</label><input id="mPhoto" type="file" accept="image/*"></div><div class="form-actions"><button class="secondary" onclick="closeCapture()">Cancel</button><button class="primary" onclick="saveMemory()">Keep this moment</button></div></div></div><div class="toast" id="toast"></div><div class="preview-modal" id="previewModal"><div class="preview-shell"><div class="preview-head"><h2>Your Morrow book</h2><div class="preview-tools"><button class="secondary" onclick="closePreview()">Close</button><button class="primary" onclick="printBook()">Save as PDF</button></div></div><div class="preview-book" id="previewBook"></div><div class="preview-caption">A4 portrait · designed as a keepsake, not a report</div></div></div><div id="printBook"></div><script>
const KEY='morrow_gold_v8';const types=[['moment','A moment','The everyday things worth remembering.'],['photo','Photograph','Give a favourite photograph a place in the story.'],['first','A first','The moments that only happen once.'],['love','Something they love','The people, places and things they adore.'],['said','Something they said','Their little words and funny phrases.'],['milestone','Milestone','A moment of change or growing.']];let state=JSON.parse(localStorage.getItem(KEY)||'null')||{setup:false,child:{name:'',dob:'',photo:''},memories:[],firsts:[],letter:'',view:'home',book:{dedication:'For the little days we never want to forget.',letter:''}};let selectedType='moment';
const prompts=['What made you laugh together this week?','What is something they do now that you never want to forget?','What sound has become part of your home?','Who made them smile today?','What tiny detail would you miss if you could not remember it?'];
function save(){localStorage.setItem(KEY,JSON.stringify(state))}function esc(s=''){return s.replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}function initials(n){return (n||'').split(' ').map(x=>x[0]).slice(0,2).join('').toUpperCase()||'M'}function fmt(d){if(!d)return '';return new Intl.DateTimeFormat('en-GB',{day:'numeric',month:'long',year:'numeric'}).format(new Date(d+'T12:00:00'))}function monthName(d){return new Intl.DateTimeFormat('en-GB',{month:'long',year:'numeric'}).format(new Date(d+'T12:00:00'))}

function readImage(file,max=1600,quality=.84){return new Promise(resolve=>{const r=new FileReader();r.onload=()=>{const img=new Image();img.onload=()=>{const scale=Math.min(1,max/Math.max(img.width,img.height));const c=document.createElement('canvas');c.width=Math.round(img.width*scale);c.height=Math.round(img.height*scale);c.getContext('2d').drawImage(img,0,0,c.width,c.height);resolve(c.toDataURL('image/jpeg',quality))};img.src=r.result};r.readAsDataURL(file)})}
function setup(){app.innerHTML=`<div class="setup"><div class="setup-card"><div class="eyebrow">Morrow</div><h1 class="serif">Let’s begin their story.</h1><p class="lead">A private place for the photographs, firsts and little moments that make their first year uniquely theirs.</p><div class="field"><label>Their name</label><input id="sName" placeholder="e.g. Florence"></div><div class="field"><label>Date they arrived</label><input id="sDob" type="date"></div><div class="field"><label>A photograph, optional</label><input id="sPhoto" type="file" accept="image/*"></div><div class="form-actions"><button type="button" class="primary" onclick="window.finishSetup()">Begin their story</button></div><p style="color:var(--muted);font-size:12px;margin-top:22px">Your prototype keeps everything in this browser. Nothing is uploaded.</p></div></div>`}
function finishSetup(){const n=document.getElementById('sName').value.trim();const dob=document.getElementById('sDob').value;if(!n||!dob){alert('Please add their name and arrival date.');return}state.child.name=n;state.child.dob=dob;state.setup=true;const f=document.getElementById('sPhoto').files[0];if(f){readImage(f).then(photo=>{state.child.photo=photo;save();render()})}else{save();render()}}
function render(){if(!state.setup){setup();return}const v=state.view||'home';app.innerHTML=`<div class="app"><header class="topbar"><div class="shell" style="display:flex;width:100%;align-items:center;justify-content:space-between"><div class="brand">morrow<span>.</span></div><nav class="nav">${nav('home','Home')}${nav('story','Story')}${nav('firsts','Firsts')}${nav('keepsake','Keepsake')}</nav><div class="top-actions"><button class="secondary" onclick="openCapture()">＋ Capture</button><button class="iconbtn" title="About them" onclick="go('about')">${initials(state.child.name)}</button></div></div></header><main class="main shell">${v==='home'?home():v==='story'?story():v==='firsts'?firsts():v==='keepsake'?keepsake():about()}</main><nav class="bottomnav">${bn('home','⌂','Home')}${bn('story','◌','Story')}${bn('firsts','✦','Firsts')}<button onclick="openCapture()"><b style="font-size:22px;line-height:18px">＋</b><span>Capture</span></button>${bn('keepsake','▢','Book')}</nav><footer class="footer shell"><span>morrow. · The first year, beautifully kept.</span><span>Private by design · Prototype</span></footer></div>`}
function nav(x,label){return `<button class="${state.view===x?'active':''}" onclick="go('${x}')">${label}</button>`}function bn(x,i,label){return `<button class="${state.view===x?'active':''}" onclick="go('${x}')"><b>${i}</b><span>${label}</span></button>`}function go(v){state.view=v;save();render();scrollTo(0,0)}
function home(){const ms=[...state.memories].sort((a,b)=>b.date.localeCompare(a.date));return `<section class="hero"><div class="hero-copy"><div class="eyebrow">Your story is growing</div><h1 class="serif">The first year, beautifully kept.</h1><p class="lead">Not a tracker. A story. Keep the photographs, firsts and little moments you will want to remember long after the days have blurred together.</p><div class="hero-actions"><button class="primary" onclick="openCapture()">Capture a moment</button><button class="secondary" onclick="go('story')">Open their story</button></div></div><div class="identity"><div class="avatar">${state.child.photo?`<img src="${state.child.photo}" alt="">`:initials(state.child.name)}</div><div><div class="eyebrow">Their story</div><div class="name">${esc(state.child.name)}</div><div style="color:var(--muted)">${fmt(state.child.dob)}</div></div></div></section><section class="section"><div class="capture-card"><div><strong style="font-family:'Playfair Display';font-size:24px;font-weight:500">Something worth keeping?</strong><p>Capture it now. You can always add the details later.</p></div><button class="primary" onclick="openCapture()">＋ Capture</button></div></section><section class="section"><div class="grid"><div class="card stat"><strong>${state.memories.length}</strong><span>memories kept</span></div><div class="card stat"><strong>${state.memories.filter(x=>x.type==='photo').length}</strong><span>photographs</span></div><div class="card stat"><strong>${state.memories.filter(x=>x.type==='first').length}</strong><span>firsts recorded</span></div></div></section><section class="section"><div class="grid"><div class="card prompt"><div class="eyebrow">A little prompt</div><div class="quote">${prompts[state.memories.length%prompts.length]}</div><button class="secondary" onclick="openCapture('moment',${JSON.stringify(prompts[state.memories.length%prompts.length])})">Keep this thought</button></div><div class="card" style="grid-column:span 2"><div class="section-head"><div><h2>Recently kept</h2><p>The newest pieces of their story.</p></div><button class="secondary" onclick="go('story')">View all</button></div>${ms.length?`<div class="memory-list">${ms.slice(0,3).map(memoryCard).join('')}</div>`:`<div class="empty">Your first memory is waiting here.<br><button class="secondary" style="margin-top:12px" onclick="openCapture()">Keep the first one</button></div>`}</div></div></section>`}
function memoryCard(m){return `<article class="memory"><div class="thumb">${m.photo?`<img src="${m.photo}" alt="">`:m.type==='photo'?'⌁':'✦'}</div><div><div class="meta">${esc(m.type)} · ${fmt(m.date)}</div><h3>${esc(m.title||'Untitled moment')}</h3><p>${esc(m.body||'')}</p></div><button class="secondary" onclick="removeMemory('${m.id}')">Remove</button></article>`}
function story(){const groups={};state.memories.forEach(m=>(groups[monthName(m.date)]??=[]).push(m));const entries=Object.entries(groups).sort((a,b)=>new Date(b[1][0].date)-new Date(a[1][0].date));return `<section class="section" style="margin-top:0"><div class="eyebrow">Their story</div><h1 class="serif" style="font-size:58px">The moments that made this year.</h1><p class="lead">A simple, chronological home for the days you never want to lose.</p><div style="margin:22px 0"><button class="primary" onclick="openCapture()">＋ Capture a moment</button></div></section><section class="section timeline">${entries.length?entries.map(([mo,arr])=>`<div class="month"><div class="month-title"><h2>${esc(mo)}</h2><div class="month-count">${arr.length} ${arr.length===1?'memory':'memories'}</div></div><div class="memory-list" style="margin-top:18px">${arr.sort((a,b)=>b.date.localeCompare(a.date)).map(memoryCard).join('')}</div></div>`).join(''):`<div class="empty">Nothing here yet. Start with one small moment.</div>`}</section>`}
function firsts(){const defaults=['First smile','First proper laugh','First tooth','First steps','First word','First adventure','First favourite toy','First birthday'];return `<section class="section" style="margin-top:0"><div class="eyebrow">Firsts</div><h1 class="serif" style="font-size:58px">The moments that only happen once.</h1><p class="lead">Keep the big firsts, and the ones that only matter to your family.</p></section><section class="section"><div class="firsts">${defaults.map((x,i)=>{const found=state.memories.find(m=>m.type==='first'&&m.title.toLowerCase()===x.toLowerCase());return `<div class="first ${found?'done':''}"><div class="symbol">${found?'✓':'✦'}</div><strong>${x}</strong><small>${found?fmt(found.date):'Not yet recorded'}</small></div>`}).join('')}<button class="first" onclick="openCapture('first')"><div class="symbol">＋</div><strong>Add your own</strong><small>A first only you would think of.</small></button></div></section>`}
function bookData(){
 const ms=[...state.memories].sort((a,b)=>a.date.localeCompare(b.date));
 const photos=ms.filter(m=>m.photo);
 const firsts=ms.filter(m=>m.type==='first');
 const months={}; ms.forEach(m=>(months[monthName(m.date)]??=[]).push(m));
 return {ms,photos,firsts,months,entries:Object.entries(months)};
}
function saveBookField(key,value){state.book=state.book||{};state.book[key]=value;save();toast('Book settings saved');render()}
function keepsake(){
 const d=bookData(); state.book=state.book||{dedication:'For the little days we never want to forget.',letter:''};
 const pageEstimate=Math.max(7,2+d.entries.reduce((n,[,a])=>n+Math.ceil(a.length/3)+1,0)+Math.ceil(d.photos.length/2)+1+(d.firsts.length?1:0)+(state.book.letter?1:0));
 const coverPhoto=d.photos[0];
 return `<section class="section" style="margin-top:0"><div class="eyebrow">Keepsake studio</div><h1 class="serif" style="font-size:58px">A book made from their year.</h1><p class="lead">Morrow turns the moments you keep into a considered first-year story. Every page is built to belong on paper.</p></section>
 <section class="section"><div class="book-studio"><div class="book-studio-head"><div><div class="studio-label">Live book</div><h2>${esc(state.child.name)} · The first year</h2><p style="margin:0;color:var(--muted)">${pageEstimate} pages · A4 portrait · ${d.ms.length} memories · ${d.photos.length} photographs</p></div><button class="primary" onclick="openPreview()">Open full preview</button></div>
 <div class="book-spread"><div class="studio-page cover"><div class="studio-kicker">morrow. · the first year</div><div><div class="studio-name">${esc(state.child.name)}</div><div class="studio-rule"></div><div class="studio-kicker">A year in little moments</div></div><div class="studio-foot">${fmt(state.child.dob)} · kept with Morrow</div></div><div class="studio-page text-page"><div class="studio-kicker">The beginning</div><div class="studio-title">The days you will wish you could step back into.</div><p class="studio-dek">Photographs, firsts, funny little details and the ordinary moments that became everything.</p>${coverPhoto?`<img src="${coverPhoto.photo}" alt="">`:''}<div class="studio-kicker" style="margin-top:auto">morrow.</div></div></div>
 <div class="studio-controls"><div class="studio-panel"><div class="studio-label">Opening dedication</div><div class="field"><input value="${esc(state.book.dedication||'')}" onblur="saveBookField('dedication',this.value)" placeholder="For the little days we never want to forget."></div><div class="studio-label">A letter to them</div><div class="field"><textarea rows="4" onblur="saveBookField('letter',this.value)" placeholder="Something they will read one day.">${esc(state.book.letter||'')}</textarea></div></div><div class="studio-panel"><div class="studio-label">What Morrow includes</div><p style="margin:10px 0 4px">✓ Cover & opening story</p><p style="margin:4px 0">✓ Monthly chapter openers</p><p style="margin:4px 0">✓ Your memories, beautifully set</p><p style="margin:4px 0">✓ Photograph-led pages</p><p style="margin:4px 0">✓ Their firsts</p><p style="margin:4px 0">✓ Your letter, when you're ready</p></div></div>
 <div class="studio-actions"><div class="meta-note">Designed as a keepsake, not a report.</div><div><button class="secondary" onclick="openPreview()">Preview book</button><button class="primary" style="margin-left:7px" onclick="printBook()">Save as PDF</button></div></div></div></section>
 <section class="section"><div class="grid"><div class="card"><div class="eyebrow">The idea</div><h2>Capture lightly. Keep beautifully.</h2><p>Morrow does the organising in the background so the final book feels intentional without asking parents to become editors.</p></div><div class="card"><div class="eyebrow">When it is finished</div><h2>Something they can hold.</h2><p>The digital story is only the beginning. This layout is designed as the foundation for a premium printed book.</p></div><div class="card"><div class="eyebrow">Your control</div><h2>Nothing is locked away.</h2><p>Edit the dedication or letter, keep adding memories, then regenerate the book whenever the story changes.</p></div></div></section>`;
}
function buildPrintBook(){
 const d=bookData(); state.book=state.book||{}; let page=1;
 const folio=()=>`<div class="print-page-number">${page}</div>`;
 let html=`<div class="print-page print-cover"><div class="print-kicker">morrow. · the first year</div><div class="cover-centre"><div class="print-title">${esc(state.child.name)}</div><div class="print-rule"></div><div class="print-subtitle">A year in little moments.<br>Photographs, firsts and all the ordinary things that became unforgettable.</div></div><div class="print-foot">${fmt(state.child.dob)} · kept with Morrow</div></div>`;page++;
 html+=`<div class="print-page print-opening"><div class="opening-inner"><div class="print-kicker">The beginning</div><h2>The days you will wish you could step back into.</h2><p class="print-dek">${esc(state.book.dedication||'This is not a record of everything. It is a collection of the things that made this year yours.')}</p>${d.photos[0]?`<img class="opening-photo" src="${d.photos[0].photo}" alt="">`:''}<div class="opening-mark">morrow.</div></div>${folio()}</div>`;page++;
 if(!d.entries.length){html+=`<div class="print-page print-quiet"><div><div class="print-kicker">A beginning</div><h2>Your story is waiting to be written.</h2><p class="print-dek">The best books begin with one small memory. Add moments in Morrow and this page will fill itself.</p></div>${folio()}</div>`;page++;}
 else d.entries.forEach(([month,arr],mi)=>{
   const first=arr[0]; const label=mi===0?'The beginning':mi===5?'Halfway through your first year':mi===11?'Your first year': 'A little more of you';
   html+=`<div class="print-page print-month"><div class="month-open"><div class="month-no">${String(mi+1).padStart(2,'0')}</div><div class="print-kicker">${esc(month)}</div><h2>${esc(label)}</h2><p class="print-dek">${arr.length} ${arr.length===1?'moment':'moments'} kept this month.</p></div>${folio()}</div>`;page++;
   for(let i=0;i<arr.length;i+=3){const chunk=arr.slice(i,i+3); const lead=chunk.find(x=>x.photo); html+=`<div class="print-page print-memory-page"><div class="memory-head"><div class="print-kicker">${esc(month)}</div><h2>${esc(i===0?'The little things that made this month.':'More moments from '+month+'.')}</h2></div>${lead?`<img class="memory-lead" src="${lead.photo}" alt="">`:''}<div class="print-memories">${chunk.map(m=>`<article class="print-memory"><div class="date">${fmt(m.date)} · ${esc(m.type)}</div><h3>${esc(m.title||'A moment')}</h3><p>${esc(m.body||'')}</p></article>`).join('')}</div>${folio()}</div>`;page++;}
 });
 if(d.firsts.length){html+=`<div class="print-page print-firsts"><div class="print-kicker">Firsts</div><h2>The moments that only happen once.</h2><p class="print-dek">The little milestones that deserve their own page.</p><div class="firsts-print">${d.firsts.slice(0,12).map(m=>`<div><div class="date">${fmt(m.date)}</div><h3>${esc(m.title)}</h3><p>${esc(m.body||'')}</p></div>`).join('')}</div>${folio()}</div>`;page++;}
 if(d.photos.length){for(let i=0;i<d.photos.length;i+=2){const pair=d.photos.slice(i,i+2);html+=`<div class="print-page print-photos"><div class="print-kicker">Photographs</div><h2>The faces, places and little details.</h2><div class="photo-pair">${pair.map((m,j)=>`<figure><img src="${m.photo}" alt=""><figcaption>${esc(m.title||'A photograph')} · ${fmt(m.date)}</figcaption></figure>`).join('')}</div>${folio()}</div>`;page++;}}
 if(state.book.letter){html+=`<div class="print-page print-letter"><div class="letter-inner"><div class="print-kicker">A letter for later</div><h2>Something they will read one day.</h2><div class="letter-body">${esc(state.book.letter).replace(/\n/g,'<br><br>')}</div><div class="letter-sign">With all our love,<br><span>${esc(state.child.name)}’s family</span></div></div>${folio()}</div>`;page++;}
 html+=`<div class="print-page print-end"><div><div class="print-kicker">morrow.</div><h2>${esc(state.child.name)}, your first year.</h2><p class="print-dek">A whole year of small moments. Kept.</p></div>${folio()}</div>`;page++;
 document.getElementById('printBook').innerHTML=html;
}
function openPreview(){buildPrintBook();const tmp=document.createElement('div');tmp.innerHTML=document.getElementById('printBook').innerHTML;window._previewPages=[...tmp.querySelectorAll('.print-page')].map(x=>x.innerHTML);window._previewIndex=0;window._showPreviewPair=()=>{const wrap=document.getElementById('previewBook'),i=window._previewIndex,a=window._previewPages[i]||'',b=window._previewPages[i+1]||'';wrap.innerHTML=`<div class="book-preview-grid"><div class="book-page left ${i===0?'cover':''}">${a}</div><div class="book-page right">${b}</div></div><div style="display:flex;justify-content:center;align-items:center;gap:10px;margin-top:16px"><button class="secondary" onclick="previewPrev()">‹</button><span style="color:#fff;font-size:12px">Pages ${i+1}${b?'–'+(i+2):''} of ${window._previewPages.length}</span><button class="secondary" onclick="previewNext()">›</button></div>`};window._showPreviewPair();document.getElementById('previewModal').classList.add('open')}
function previewPrev(){window._previewIndex=Math.max(0,window._previewIndex-2);window._showPreviewPair&&window._showPreviewPair()}
function previewNext(){window._previewIndex=Math.min(Math.max(0,window._previewPages.length-2),window._previewIndex+2);window._showPreviewPair&&window._showPreviewPair()}
function closePreview(){document.getElementById('previewModal').classList.remove('open')}
function printBook(){buildPrintBook();setTimeout(()=>window.print(),60)}
function about(){return `<section class="section" style="margin-top:0"><div class="eyebrow">About them</div><h1 class="serif" style="font-size:58px">${esc(state.child.name)}’s story.</h1><div class="card" style="max-width:650px"><div class="field"><label>Name</label><input id="aName" value="${esc(state.child.name)}"></div><div class="field"><label>Date they arrived</label><input id="aDob" type="date" value="${state.child.dob}"></div><button class="primary" onclick="saveAbout()">Save details</button><button class="secondary" style="margin-left:7px" onclick="backup()">Export backup</button><button class="secondary" style="margin-left:7px" onclick="document.getElementById('restore').click()">Restore</button><input id="restore" class="hidden" type="file" accept="application/json" onchange="restore(event)"></div></section>`}
function saveAbout(){state.child.name=document.getElementById('aName').value.trim()||state.child.name;state.child.dob=document.getElementById('aDob').value||state.child.dob;save();toast('Details saved');render()}function backup(){const b=new Blob([JSON.stringify(state,null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='morrow-backup.json';a.click()}function restore(e){const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{state=JSON.parse(r.result);save();render();toast('Backup restored')}catch{alert('That backup could not be read.')}};r.readAsText(f)}
function openCapture(t='moment',prefill=''){selectedType=t;document.getElementById('captureModal').classList.add('open');document.getElementById('mDate').value=new Date().toISOString().slice(0,10);document.getElementById('mTitle').value='';document.getElementById('mBody').value=prefill;document.getElementById('mPhoto').value='';document.getElementById('types').innerHTML=types.map(([id,n,d])=>`<button class="type ${id===selectedType?'selected':''}" onclick="selectType('${id}')"><strong>${n}</strong><br><small>${d}</small></button>`).join('')}function selectType(t){selectedType=t;document.querySelectorAll('.type').forEach(x=>x.classList.toggle('selected',x.innerText.startsWith(types.find(y=>y[0]===t)[1])))}function closeCapture(){document.getElementById('captureModal').classList.remove('open')}function saveMemory(){const date=document.getElementById('mDate').value,title=document.getElementById('mTitle').value.trim(),body=document.getElementById('mBody').value.trim();if(!date||!title){alert('Please add a date and title.');return}const f=document.getElementById('mPhoto').files[0];const finish=photo=>{state.memories.push({id:Date.now().toString(),date,title,body,type:selectedType,photo:photo||''});save();closeCapture();toast('Moment kept');render()};if(f){readImage(f).then(finish)}else finish('')}function removeMemory(id){if(!confirm('Remove this memory?'))return;state.memories=state.memories.filter(x=>x.id!==id);save();render();toast('Memory removed')}function toast(s){const t=document.getElementById('toast');t.textContent=s;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),1800)}
// Explicitly expose UI handlers for browsers/webviews that do not resolve inline handlers reliably.
Object.assign(window,{setup,finishSetup,render,go,openCapture,selectType,closeCapture,saveMemory,removeMemory,saveAbout,backup,restore,toast,openPreview,closePreview,previewPrev,previewNext,printBook});
render();
</script></body></html>
