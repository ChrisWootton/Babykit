@media(max-width:850px){.hero{min-height:0}.hero-points{grid-template-columns:1fr}.trust-strip{gap:16px;flex-wrap:wrap}.editorial{padding:55px 0}.editorial-grid{grid-template-columns:1fr}.quote-block{margin-bottom:45px}.site-footer{gap:10px;flex-direction:column}}

</head>
<body>
<header class="topbar">
  <div class="brand"><div class="logo">m</div><span>Morrow</span></div>
  <div class="actions"><button class="btn soft" id="saveBtn">Save on this device</button><button class="btn primary" id="previewBtn">Preview book</button></div>
</header>

<div class="layout">
<aside class="sidebar">
  <div class="nav" id="nav"></div>
  <div class="progress"><div class="progress-row"><strong>Book progress</strong><span id="progressText">0%</span></div><div class="bar"><span id="progressBar"></span></div></div>
  <div class="privacy">🔒 <strong>Private by design.</strong><br>Your memories stay on this device in this prototype. Nothing is uploaded.</div>
</aside>

<main id="main"></main>
</div><footer class="site-footer"><span>© Morrow · The first year, beautifully kept.</span><span>Private by design · Prototype</span></footer>

<div class="mobile-bar" id="mobileBar">
      <button id="mobileBack" aria-label="Previous step">‹</button>
      <div><span id="mobileStep">1 / 7</span><b id="mobileStepName">Baby details</b></div>
      <button id="mobileNext" aria-label="Next step">›</button>
    </div>
    <div class="modal" id="modal">
  <div class="modal-box">
    <div class="modal-head">
      <div><div class="kicker">BOOK PREVIEW</div><strong id="previewTitle">The First Year</strong></div>
      <div class="modal-head-actions"><button class="btn" id="closePreview">Close</button><button class="btn primary" id="printBook">Print / Save PDF</button></div>
    </div>
    <div class="preview-scroll" id="previewScroll"></div>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
const KEY='morrow-gold-v5';
const steps=['Welcome','Baby details','Before you arrived','Your arrival','Month by month','Firsts','A letter','Your book'];
const firstNames=['First smile','First laugh','First bath','First outing','First food','First tooth','First crawl','First steps','First word','First Christmas','First birthday','Favourite toy'];
const themes={
 sage:{name:'Soft Sage',desc:'Calm & natural',bg:'#96a596'},
 sand:{name:'Warm Sand',desc:'Warm & timeless',bg:'#b9a487'},
 blush:{name:'Quiet Blush',desc:'Soft & gentle',bg:'#c9a39a'}
};
const blank=()=>({
 baby:{name:'',dob:'',time:'',weight:'',length:'',place:''},
 before:{announcement:'',nursery:'',excited:'',photo:null},
 arrival:{story:'',thoughts:'',photo:null},
 months:Array.from({length:12},(_,i)=>({notes:'',favourite:'',newthing:'',photo:null})),
 firsts:firstNames.map(n=>({name:n,value:''})),
 letter:'',
 family:'',
 favourites:'',
 theme:'sage'
});
let state=loadState(), step=0, month=0;

function loadState(){try{const x=JSON.parse(localStorage.getItem(KEY));if(x)return merge(blank(),x)}catch(e){}return blank()}
function merge(base,x){
  Object.keys(base).forEach(k=>{if(Array.isArray(base[k])){if(Array.isArray(x[k]))base[k]=x[k]}else if(base[k]&&typeof base[k]==='object'){if(x[k]&&typeof x[k]==='object')base[k]={...base[k],...x[k]}}else if(x[k]!==undefined)base[k]=x[k]});
  return base;
}
function save(show=true){localStorage.setItem(KEY,JSON.stringify(state));if(show)toast('Saved on this device');updateProgress()}
function toast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');clearTimeout(window.tt);window.tt=setTimeout(()=>t.classList.remove('show'),1700)}
function esc(v=''){return String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]))}
function dateGB(v){if(!v)return '';const d=new Date(v+'T00:00:00');return d.toLocaleDateString('en-GB',{day:'numeric',month:'long',year:'numeric'})}
function setPath(path,value){let o=state;const p=path.split('.');for(let i=0;i<p.length-1;i++)o=o[p[i]];o[p[p.length-1]]=value;save(false);updateProgress()}
function getPath(path){let o=state;for(const p of path.split('.'))o=o?.[p];return o??''}

function updateProgress(){
 const checks=[
  !!state.baby.name,!!state.baby.dob,!!state.baby.photo,!!state.before.announcement,!!state.arrival.story,
  ...state.months.map(m=>!!(m.notes||m.favourite||m.newthing||m.photo)),
  ...state.firsts.map(x=>!!x.value),!!state.letter,!!state.family,!!state.favourites
 ];
 const pct=Math.round(checks.filter(Boolean).length/checks.length*100);
 document.getElementById('progressBar').style.width=pct+'%';document.getElementById('progressText').textContent=pct+'%';
}
function renderNav(){
 document.getElementById('nav').innerHTML=steps.map((s,i)=>`<button class="${step===i?'active':''}" data-step="${i}">${String(i).padStart(2,'0')} &nbsp; ${s}</button>`).join('');
 document.querySelectorAll('[data-step]').forEach(b=>b.onclick=()=>{step=+b.dataset.step;render()});
}
function field(label,path,type='text',placeholder=''){
 return `<div class="field"><label>${label}</label><input data-path="${path}" type="${type}" value="${esc(getPath(path))}" placeholder="${esc(placeholder)}"></div>`
}
function textarea(label,path,placeholder=''){
 return `<div class="field full"><label>${label}</label><textarea data-path="${path}" placeholder="${esc(placeholder)}">${esc(getPath(path))}</textarea></div>`
}
function actions(){
 return `<div class="section-actions"><button class="btn" id="backBtn">← Back</button><button class="btn primary" id="nextBtn">Continue →</button></div>`
}
function bindFields(){
 document.querySelectorAll('[data-path]').forEach(el=>el.addEventListener('input',()=>setPath(el.dataset.path,el.value)));
 document.getElementById('backBtn')?.addEventListener('click',()=>{step=Math.max(0,step-1);render()});
 document.getElementById('nextBtn')?.addEventListener('click',()=>{save(false);step=Math.min(7,step+1);render()});
}

function render(){
 renderNav();updateProgress();
 const m=document.getElementById('main');
 if(step===0)m.innerHTML=`
  <section class="hero"><div class="hero-copy"><span class="eyebrow">MORROW · A DIGITAL KEEPSAKE</span><h1>The first year, beautifully kept.</h1><p class="lead">A private place for the photographs, firsts and little moments that make their first year uniquely theirs.</p><div class="hero-points"><div class="hero-point"><i>✓</i>Capture the moments worth remembering</div><div class="hero-point"><i>✓</i>Build their story, month by month</div><div class="hero-point"><i>✓</i>Keep memories on your device</div><div class="hero-point"><i>✓</i>Create a beautiful A4 keepsake</div></div><button class="btn primary large" id="start">Begin their story →</button><div class="mini-note">No account required · Start free · Designed for mobile</div></div><div class="cover-mock"><div class="heart">♡</div><small>MORROW</small><strong>The First Year</strong><em>The first year, beautifully kept.</em></div></section><div class="trust-strip"><span>Private by design</span><span>Mobile first</span><span>Print ready</span><span>Made for memories</span></div><section class="editorial"><div class="editorial-head"><div class="kicker">A DIFFERENT KIND OF BABY BOOK</div><h2>Not a tracker. A story.</h2><p class="lead">The moments that matter are rarely the ones that fit neatly into a milestone chart. Morrow gives them somewhere beautiful to live.</p></div><div class="editorial-grid"><div class="editorial-card"><div class="num">01</div><h3>The moments</h3><p>Photographs, stories and tiny details, captured without turning parenthood into another task list.</p></div><div class="editorial-card"><div class="num">02</div><h3>The firsts</h3><p>From first smiles to first adventures, keep the moments that only happen once.</p></div><div class="editorial-card"><div class="num">03</div><h3>The keepsake</h3><p>When the year is over, turn everything you've captured into a considered, print-ready book.</p></div></div></section><div class="quote-block"><p>“One day, the tiny details will be the things you miss most.”</p></div>
  <section class="cards"><div class="card"><strong>01 · Twelve chapters</strong><p>One elegant page for every month, with a hero photo and prompts for the details you'll want to remember.</p></div><div class="card"><strong>02 · The little things</strong><p>Capture firsts, favourite things, family memories and the funny details that make your baby uniquely them.</p></div><div class="card"><strong>03 · A finished keepsake</strong><p>Preview the complete book before printing or saving it as an A4 PDF.</p></div></section>`;
 else if(step===1)m.innerHTML=`
  <section class="panel"><div class="panel-head"><div class="kicker">01 · BABY DETAILS</div><h2>Let's start with the basics.</h2><p class="sub">These details appear on the cover and arrival page.</p></div>
  <div class="grid2">${field("Baby's name",'baby.name')}${field('Date of birth','baby.dob','date')}${field('Time of birth','baby.time','time')}${field('Birth weight','baby.weight','text','e.g. 7 lb 14 oz')}${field('Birth length','baby.length','text','e.g. 51 cm')}${field('Place of birth','baby.place','text','e.g. Watford')}</div>
  <div class="upload"><div class="upload-preview" id="babyPhotoPreview">${state.baby.photo?`<img src="${state.baby.photo}" alt="">`:'♡'}</div><div><strong>Cover photo</strong><small>Use a favourite portrait. Your photograph is prepared locally, ready for the finished keepsake.</small><label class="btn soft file">Choose photo<input type="file" id="babyPhoto" accept="image/*"></label></div></div>${actions()}</section>`;
 else if(step===2)m.innerHTML=`
  <section class="panel"><div class="panel-head"><div class="kicker">02 · BEFORE YOU ARRIVED</div><h2>The story started before the first hello.</h2><p class="sub">Keep the details you might forget in years to come.</p></div>
  <div class="grid2">${textarea('The pregnancy announcement','before.announcement','How did you share the news?')}${textarea('Preparing for baby','before.nursery','Tell the story of the nursery, names you considered, or things you bought...')}${textarea('What we were most excited about','before.excited','The things you could not wait to experience...')}</div>
  <div class="upload"><div class="upload-preview">${state.before.photo?`<img src="${state.before.photo}" alt="">`:'♡'}</div><div><strong>A photo from before you arrived</strong><small>Scan, nursery, bump photo or another favourite memory.</small><label class="btn soft file">Choose photo<input type="file" id="beforePhoto" accept="image/*"></label></div></div>${actions()}</section>`;
 else if(step===3)m.innerHTML=`
  <section class="panel"><div class="panel-head"><div class="kicker">03 · YOUR ARRIVAL</div><h2>Welcome to the world.</h2><p class="sub">Write the version of the story you want your child to read one day.</p></div>
  <div class="grid2">${textarea('Birth story','arrival.story','What happened on the day your baby arrived?')}${textarea('Our first thoughts','arrival.thoughts','What did you think and feel when you first met?')}</div>
  <div class="upload"><div class="upload-preview">${state.arrival.photo?`<img src="${state.arrival.photo}" alt="">`:'♡'}</div><div><strong>First photo</strong><small>A favourite photo from those first days.</small><label class="btn soft file">Choose photo<input type="file" id="arrivalPhoto" accept="image/*"></label></div></div>${actions()}</section>`;
 else if(step===4)renderMonth(m);
 else if(step===5)m.innerHTML=`
  <section class="panel"><div class="panel-head"><div class="kicker">05 · MY FIRSTS & FAVOURITES</div><h2>Little firsts, forever memories.</h2><p class="sub">Add a date, a note, or both. The prompts are there when you need a little inspiration.</p></div>
  <div class="prompt-grid">${['The tiny habit we never want to forget…','The thing that always made you smile…','A phrase or sound you kept making…'].map(x=>`<button class="prompt" type="button">${x}</button>`).join('')}</div>
  <div class="firsts">${state.firsts.map((x,i)=>`<div class="first"><strong>${esc(x.name)}</strong><input data-first="${i}" value="${esc(x.value)}" placeholder="e.g. 12 March, at home"></div>`).join('')}</div>
  <div class="grid2" style="margin-top:14px">${textarea('The people who made your first year special','family','Grandparents, siblings, friends, family traditions...')}${textarea('Favourite things right now','favourites','Foods, songs, toys, books, cuddles, places...')}</div>${actions()}</section>`;
 else if(step===6)m.innerHTML=`
  <section class="panel"><div class="panel-head"><div class="kicker">06 · A LETTER TO YOU</div><h2>Something they'll read one day.</h2><p class="sub">Write it now, even if the words are simple.</p></div>
  <div class="letter"><div style="font:500 18px Georgia,serif">Dear ${esc(state.baby.name||'little one')},</div><textarea id="letter" placeholder="Today I want you to know...">${esc(state.letter)}</textarea><div style="font:500 16px Georgia,serif">Love, your family ♡</div></div>${actions()}</section>`;
 else m.innerHTML=`
  <section class="panel"><div class="panel-head"><div class="kicker">07 · YOUR BOOK</div><h2>Quiet, simple, yours.</h2><p class="sub">You're nearly there. Choose the cover tone, preview the finished book, and make any final changes before you export it.</p></div>
  <div class="completion"><div><b>${esc(state.baby.name||'Your baby')}'s first year</b><br><span>${state.months.filter(m=>m.notes||m.favourite||m.newthing||m.photo).length}/12 monthly chapters added</span></div><strong id="progressText2">${document.getElementById('progressText')?.textContent||'0%'}</strong></div>
  <div class="themes" style="margin-top:15px">${Object.entries(themes).map(([id,t])=>`<button class="theme ${state.theme===id?'selected':''}" data-theme="${id}"><div class="swatch" style="background:${t.bg}">Morrow</div><strong>${t.name}</strong><span>${t.desc}</span></button>`).join('')}</div>
  <div class="book-note"><strong>Ready when you are.</strong><br>Your book is generated in your browser. Preview it first, then use Print / Save PDF to create the finished A4 file. Your £9.99 purchase button is ready for Stripe when you connect your payment link.</div>
  <div class="backup-tools"><button class="btn soft" id="exportBackup">Export backup</button><label class="btn soft restore">Restore backup<input type="file" id="restoreBackup" accept="application/json,.json"></label></div>
  <div class="section-actions"><button class="btn" id="backBtn">← Back</button><button class="btn primary large" id="finalPreview">Preview your book →</button><button class="btn soft large" id="buyBook">Create the finished keepsake · £9.99</button></div></section>`;
 bindFields();
 bindSpecial();
 updateMobileBar();
}
function renderMonth(m){
 const x=state.months[month];
 m.innerHTML=`<section class="panel"><div class="panel-head"><div class="kicker">04 · MONTH BY MONTH</div><h2>One month at a time.</h2><p class="sub">You can come back whenever you have something worth remembering.</p></div>
 <div class="month-tabs">${state.months.map((v,i)=>`<button class="month-tab ${i===month?'active':''}" data-month-tab="${i}">Month ${i+1}${v.notes||v.photo?' •':''}</button>`).join('')}</div>
 <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:15px"><strong style="font:500 25px Georgia,serif">Month ${month+1}</strong><span class="saved">Saved locally</span></div>
 <div class="grid2">${textarea('What was happening this month?','months.'+month+'.notes','A little story about this month...')}${textarea('Favourite things','months.'+month+'.favourite','Toys, songs, cuddles, foods...')}${textarea('New things you learned','months.'+month+'.newthing','New sounds, movements, skills or funny habits...')}</div>
 <div class="upload"><div class="upload-preview">${x.photo?`<img src="${x.photo}" alt="">`:'♡'}</div><div><strong>Monthly photo</strong><small>One hero photo keeps the printed page clean and minimalist.</small><label class="btn soft file">Choose photo<input type="file" id="monthPhoto" accept="image/*"></label></div></div>
 <div class="section-actions"><button class="btn" id="backBtn">← Back</button><button class="btn primary" id="nextBtn">Continue →</button></div></section>`;
 document.querySelectorAll('[data-month-tab]').forEach(b=>b.onclick=()=>{month=+b.dataset.month;render()});
 bindFields();bindSpecial();
}
function bindSpecial(){
 document.getElementById('start')?.addEventListener('click',()=>{step=1;render()});
 document.getElementById('finalPreview')?.addEventListener('click',openPreview);
 document.getElementById('buyBook')?.addEventListener('click',handleBuyBook);
 document.querySelectorAll('[data-first]').forEach(el=>el.addEventListener('input',()=>{state.firsts[+el.dataset.first].value=el.value;save(false);updateProgress()}));
 document.getElementById('letter')?.addEventListener('input',e=>{state.letter=e.target.value;save(false);updateProgress()});
 document.querySelectorAll('.prompt').forEach(b=>b.onclick=()=>{const ta=document.querySelector('[data-path=\"months.'+month+'.notes\"]');if(ta){ta.value+=(ta.value?'\n\n':'')+b.textContent;ta.dispatchEvent(new Event('input',{bubbles:true}))}else{const f=document.querySelector('[data-path=\"favourites\"]');if(f){f.value+=(f.value?'\n':'')+b.textContent;f.dispatchEvent(new Event('input',{bubbles:true}))}}});
 document.querySelectorAll('[data-theme]').forEach(b=>b.onclick=()=>{state.theme=b.dataset.theme;save(false);render()});
 document.getElementById('babyPhoto')?.addEventListener('change',e=>handleImage(e.target.files[0],img=>{state.baby.photo=img;save(false);render()}));
 document.getElementById('beforePhoto')?.addEventListener('change',e=>handleImage(e.target.files[0],img=>{state.before.photo=img;save(false);render()}));
 document.getElementById('arrivalPhoto')?.addEventListener('change',e=>handleImage(e.target.files[0],img=>{state.arrival.photo=img;save(false);render()}));
 document.getElementById('monthPhoto')?.addEventListener('change',e=>handleImage(e.target.files[0],img=>{state.months[month].photo=img;save(false);render()}));
 document.getElementById('exportBackup')?.addEventListener('click',exportBackup);
 document.getElementById('restoreBackup')?.addEventListener('change',restoreBackup);
}
function exportBackup(){
 const blob=new Blob([JSON.stringify(state)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='babykit-backup.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);toast('Backup exported');
}
function restoreBackup(e){
 const file=e.target.files?.[0];if(!file)return;const r=new FileReader();r.onload=()=>{try{const incoming=JSON.parse(r.result);state=merge(blank(),incoming);save(false);render();toast('Backup restored')}catch(err){toast('That backup could not be read')}};r.readAsText(file);
}
function handleImage(file,cb){
 if(!file)return;
 const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const max=1400,scale=Math.min(1,max/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.round(im.width*scale);c.height=Math.round(im.height*scale);c.getContext('2d').drawImage(im,0,0,c.width,c.height);cb(c.toDataURL('image/jpeg',.78))};im.src=r.result};r.readAsDataURL(file);
}
function stat(label,value){return `<div class="stat"><small>${label}</small><b>${esc(value||'Not added')}</b></div>`}
function footer(n,name){return `<div class="footer"><span>${esc(name)}</span><span>${n}</span></div>`}
function para(title,value){return value?`<div class="story"><h3>${title}</h3><p>${esc(value)}</p></div>`:''}
function page(inner,cls=''){return `<article class="page ${cls}">${inner}</article>`}
function buildBook(){
 const b=state.baby,name=b.name||'Your Baby',theme=themes[state.theme], pages=[];
 pages.push(page(`<div class="cover-inner"><div class="kicker" style="color:rgba(255,255,255,.75)">BABYKIT · MY FIRST YEAR</div>${b.photo?`<img class="hero-photo" src="${b.photo}" alt="">`:`<div class="placeholder">♡</div>`}<h1>${esc(name)}</h1><div style="font-size:18px">The First Year</div><div style="font-size:10px;opacity:.75;margin-top:18px">${dateGB(b.dob)||'A year of little moments'}</div></div>${footer(1,name)}`,'cover'));
 pages.push(page(`<div class="kicker">BEFORE YOU ARRIVED</div><h2>The story started here.</h2>${state.before.photo?`<img class="month-photo" style="height:62mm" src="${state.before.photo}" alt="">`:''}${para('The announcement',state.before.announcement)}${para('Preparing for baby',state.before.nursery)}${para('What we were most excited about',state.before.excited)}${footer(2,name)}`));
 pages.push(page(`<div class="kicker">YOUR ARRIVAL</div><h2>Welcome to the world.</h2><div class="stats">${stat('Born',dateGB(b.dob))}${stat('Time',b.time)}${stat('Place',b.place)}</div><div class="stats">${stat('Weight',b.weight)}${stat('Length',b.length)}${stat('Name',name)}</div>${state.arrival.photo?`<img class="month-photo" style="height:65mm" src="${state.arrival.photo}" alt="">`:''}${para('Birth story',state.arrival.story)}${para('Our first thoughts',state.arrival.thoughts)}${footer(3,name)}`));
 state.months.forEach((m,i)=>{
   const img=m.photo?`<img class="month-photo" src="${m.photo}" alt="">`:`<div class="month-photo" style="display:grid;place-items:center;color:#aaa79d;font-size:11px">A favourite photo from month ${i+1}</div>`;
   pages.push(page(`<div class="kicker">MONTH ${i+1}</div><div class="month-no">${String(i+1).padStart(2,'0')}</div><h2>${['The beginning','Finding our rhythm','A little more personality','Growing every day','So much to discover','Halfway through your first year','More curious every day','Your world is getting bigger','Little moments, big changes','On the move','Almost one','Your first year'][i]}</h2>${img}<div class="month-layout"><div>${para('This month',m.notes)}</div><div>${para('Favourite things',m.favourite)}${para('New things',m.newthing)}</div></div>${footer(i+4,name)}`,'month'));
 });
 const filled=state.firsts.filter(x=>x.value);
 pages.push(page(`<div class="kicker">MY FIRSTS</div><h2>Little firsts, forever memories.</h2><div class="first-grid">${(filled.length?filled:state.firsts.slice(0,8)).map(x=>`<div class="first-item"><b>${esc(x.name)}</b><span>${esc(x.value||'A memory to come')}</span></div>`).join('')}</div>${footer(16,name)}`));
 pages.push(page(`<div class="kicker">THE PEOPLE & LITTLE THINGS</div><h2>The things around you.</h2>${para('The people who made this year special',state.family)}${para('Favourite things right now',state.favourites)}${footer(17,name)}`));
 pages.push(page(`<div class="kicker">A LETTER TO YOU</div><h2>Dear ${esc(name)},</h2><div class="letter-text">${esc(state.letter||'Write something here that you would like your little one to read one day.')}</div><div style="font:500 15px Georgia,serif;margin-top:20px">Love, your family ♡</div>${footer(18,name)}`,'letter-page'));
 pages.push(page(`<div><div class="kicker">BABYKIT · MY FIRST YEAR</div><h2>And just like that, one year.</h2><p>Your first year is made from thousands of tiny moments. Thank you for letting us remember them.</p><div style="font:500 18px Georgia,serif;margin-top:16mm">♡</div></div>${footer(19,name)}`,'back-cover'));
 return pages.join('').replace(/var\\(--page-cover,[^)]+\\)/g,theme.bg);
}
function openPreview(){save(false);document.getElementById('previewTitle').textContent=(state.baby.name||'My Baby')+' · The First Year';document.getElementById('previewScroll').innerHTML=buildBook();document.getElementById('modal').classList.add('show')}
function closePreview(){document.getElementById('modal').classList.remove('show')}
document.getElementById('saveBtn').onclick=()=>save(true);
document.getElementById('previewBtn').onclick=openPreview;
document.getElementById('closePreview').onclick=closePreview;
document.getElementById('printBook').onclick=()=>window.print();

const BABYKIT_PAYMENT_LINK = ""; // Add your Stripe Payment Link here when ready.

function updateMobileBar(){
  const bar=document.getElementById('mobileBar');
  if(!bar)return;
  const names=['Welcome','Baby details','Before you arrived','Your arrival','Month by month','Firsts','A letter','Your book'];
  document.getElementById('mobileStep').textContent=(step===0?'Welcome':step+' / 7');
  document.getElementById('mobileStepName').textContent=names[step];
  document.getElementById('mobileBack').disabled=step===0;
  document.getElementById('mobileNext').disabled=step===7;
  document.getElementById('mobileBack').style.opacity=step===0?.4:1;
  document.getElementById('mobileNext').style.opacity=step===7?.4:1;
}
document.getElementById('mobileBack')?.addEventListener('click',()=>{if(step>0){step--;render();window.scrollTo({top:0,behavior:'smooth'})}});
document.getElementById('mobileNext')?.addEventListener('click',()=>{if(step<7){step++;render();window.scrollTo({top:0,behavior:'smooth'})}});

function handleBuyBook(){
  if(BABYKIT_PAYMENT_LINK){
    window.location.href=BABYKIT_PAYMENT_LINK;
  }else{
    toast('Stripe payment link not added yet');
  }
}

render();
updateMobileBar();
</script>
</body>
