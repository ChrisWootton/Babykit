<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BabyKit | My First Year</title><meta name="description" content="Create a beautiful private first-year baby memory book in your browser."><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@500;600;700&display=swap" rel="stylesheet"><style>
:root{--ink:#342f37;--muted:#786f78;--paper:#fffaf7;--panel:#fff;--rose:#d98c9f;--sage:#9aaf9a;--cream:#f5eee8;--line:#eadfd9;--shadow:0 18px 50px rgba(68,47,55,.10);--radius:22px}*{box-sizing:border-box}body{margin:0;color:var(--ink);background:linear-gradient(180deg,#fff8f5 0,#f9f5f1 100%);font-family:'DM Sans',system-ui,sans-serif}button,input,textarea{font:inherit}button{cursor:pointer}.app{min-height:100vh}.topbar{position:sticky;top:0;z-index:10;background:rgba(255,250,247,.92);backdrop-filter:blur(16px);border-bottom:1px solid rgba(234,223,217,.8);padding:16px 22px;display:flex;align-items:center;justify-content:space-between}.brand{display:flex;align-items:center;gap:10px;font-weight:700}.brandmark{width:38px;height:38px;border-radius:13px;background:linear-gradient(145deg,#eeb3bd,#cf8195);display:grid;place-items:center;color:#fff;font-size:20px;box-shadow:0 8px 18px rgba(217,140,159,.25)}.actions{display:flex;gap:8px}.btn{border:1px solid var(--line);background:#fff;border-radius:12px;padding:10px 14px;color:var(--ink);font-weight:600}.btn.primary{background:var(--ink);color:#fff;border-color:var(--ink)}.btn.soft{background:var(--cream)}.layout{max-width:1250px;margin:0 auto;padding:26px 20px 50px;display:grid;grid-template-columns:260px 1fr;gap:24px}.sidebar{background:rgba(255,255,255,.8);border:1px solid var(--line);border-radius:22px;padding:14px;height:max-content;position:sticky;top:87px}.navitem{width:100%;text-align:left;border:0;background:transparent;padding:12px 14px;border-radius:13px;color:var(--muted);font-weight:600;margin:2px 0}.navitem.active{background:var(--cream);color:var(--ink)}.progress{margin-top:14px;padding:14px;border-radius:16px;background:#fff}.progressbar{height:8px;background:#efe5e0;border-radius:99px;overflow:hidden;margin:9px 0}.progressbar span{display:block;height:100%;background:linear-gradient(90deg,var(--rose),#e8b7c1);border-radius:99px}.main{min-width:0}.hero{background:linear-gradient(145deg,#fff 0,#f9f0ec 100%);border:1px solid var(--line);border-radius:28px;padding:32px;box-shadow:var(--shadow);display:grid;grid-template-columns:1.2fr .8fr;gap:26px;align-items:center}.eyebrow{text-transform:uppercase;letter-spacing:.12em;font-weight:700;font-size:12px;color:var(--rose)}h1,h2,h3{font-family:'Playfair Display',serif;margin:0 0 12px}h1{font-size:52px;line-height:1.02}h2{font-size:32px}h3{font-size:22px}.hero p{font-size:18px;color:var(--muted);max-width:650px;line-height:1.65}.cover-preview{aspect-ratio:4/5;background:linear-gradient(155deg,#f2cfd4,#e7b0ba);border-radius:24px;padding:24px;display:flex;flex-direction:column;justify-content:space-between;text-align:center;color:#5b4148;box-shadow:0 20px 35px rgba(80,52,61,.12);overflow:hidden}.cover-preview .cover-photo{width:100%;aspect-ratio:1;border-radius:18px;background:#f7e9e4;display:grid;place-items:center;color:#a88990;font-weight:600;overflow:hidden}.cover-preview img{width:100%;height:100%;object-fit:cover}.cover-name{font-family:'Playfair Display',serif;font-size:34px}.section{margin-top:24px;background:#fff;border:1px solid var(--line);border-radius:24px;padding:24px;box-shadow:0 10px 30px rgba(68,47,55,.05)}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}.field{display:flex;flex-direction:column;gap:7px}.field label{font-size:13px;font-weight:700;color:var(--muted)}.field input,.field textarea,.select{border:1px solid var(--line);border-radius:12px;padding:12px 13px;background:#fff;outline:none}.field textarea{min-height:120px;resize:vertical}.field input:focus,.field textarea:focus{border-color:var(--rose);box-shadow:0 0 0 4px rgba(217,140,159,.12)}.photo-drop{border:2px dashed var(--line);border-radius:18px;padding:20px;text-align:center;background:#fffaf8}.photo-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:14px}.thumb{aspect-ratio:1;border-radius:13px;overflow:hidden;background:#f4ece8;position:relative}.thumb img{width:100%;height:100%;object-fit:cover}.thumb button{position:absolute;top:6px;right:6px;border:0;background:rgba(0,0,0,.55);color:#fff;width:24px;height:24px;border-radius:50%}.months{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.month-card{border:1px solid var(--line);border-radius:17px;padding:16px;background:#fffdfc}.month-card h4{margin:0 0 7px;font-family:'Playfair Display',serif;font-size:20px}.tag{display:inline-block;padding:5px 8px;border-radius:99px;background:var(--cream);font-size:11px;font-weight:700;color:#75606a}.firsts{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.first{border:1px solid var(--line);border-radius:16px;padding:14px}.first-row{display:flex;align-items:center;justify-content:space-between;gap:10px}.check{width:22px;height:22px;border:2px solid #d8ccc5;border-radius:6px;background:#fff}.check.on{background:var(--sage);border-color:var(--sage);position:relative}.check.on:after{content:'✓';color:#fff;position:absolute;inset:0;display:grid;place-items:center;font-size:13px;font-weight:800}.status{color:var(--muted);font-size:12px}.book-actions{display:flex;gap:10px;justify-content:flex-end;margin-top:18px}.note{font-size:12px;color:var(--muted);line-height:1.5}.modal{position:fixed;inset:0;background:rgba(30,22,28,.5);display:none;place-items:center;padding:20px;z-index:50}.modal.show{display:grid}.modal-card{background:#fff;border-radius:24px;max-width:900px;width:100%;max-height:90vh;overflow:auto;padding:20px}.book{background:#f2ece7;padding:20px}.page{background:#fffaf7;border:1px solid #eee0d8;margin:0 auto 18px;max-width:720px;min-height:880px;padding:58px;box-shadow:0 14px 35px rgba(68,47,55,.08);break-after:page;position:relative;overflow:hidden}.page .page-no{position:absolute;bottom:20px;left:0;right:0;text-align:center;color:#b2a2a0;font-size:12px}.page.cover{background:linear-gradient(145deg,#f0cbd1,#e9b4bf);display:flex;align-items:center;justify-content:center;text-align:center;min-height:900px}.page.cover .cover-inner{width:100%}.page.cover .memory-photo{max-width:440px;aspect-ratio:1;margin:28px auto;border-radius:25px;overflow:hidden;background:#f7ebe6;display:grid;place-items:center}.page.cover img,.memory-photo img,.memory-small img{width:100%;height:100%;object-fit:cover}.split{display:grid;grid-template-columns:1fr 1fr;gap:22px}.memory-small{aspect-ratio:1;border-radius:18px;background:#f2eae5;overflow:hidden}.quote{border-left:4px solid var(--rose);padding-left:16px;font-style:italic;color:#6e5b63}.page h2{font-size:42px}.page h3{font-size:28px;margin-top:25px}.monthpage{display:grid;grid-template-columns:1fr 1fr;gap:25px}.little{color:#85747a;line-height:1.65}.hide{display:none!important}@media(max-width:950px){.layout{grid-template-columns:1fr}.sidebar{position:static}.hero{grid-template-columns:1fr}.months{grid-template-columns:repeat(2,1fr)}.grid3{grid-template-columns:1fr 1fr}}@media(max-width:650px){.layout{padding:14px}.topbar{padding:12px}.hero{padding:22px}.hero h1{font-size:40px}.grid2,.grid3,.firsts,.split,.monthpage{grid-template-columns:1fr}.photo-grid{grid-template-columns:repeat(3,1fr)}.page{padding:30px;min-height:740px}.book-actions{justify-content:stretch}.book-actions .btn{flex:1}.actions .btn.soft{display:none}}
@media print{body{background:#fff}.topbar,.sidebar,.main,.modal-card>div:first-child{display:none!important}.modal{position:static;background:none;padding:0;display:block!important}.modal-card{max-width:none;border:0;padding:0}.book{padding:0;background:#fff}.page{box-shadow:none;margin:0;max-width:none;border:0;min-height:100vh;page-break-after:always}}
</style></head><body><div class="app"><div class="topbar"><div class="brand"><div class="brandmark">♡</div><div>BabyKit</div></div><div class="actions"><button class="btn soft" id="saveBtn">Save on this device</button><button class="btn primary" id="previewBtn">Preview book</button></div></div><div class="layout"><aside class="sidebar"><button class="navitem active" data-step="0">🌷 Welcome</button><button class="navitem" data-step="1">👶 Baby details</button><button class="navitem" data-step="2">🎀 Your arrival</button><button class="navitem" data-step="3">📷 Photos & memories</button><button class="navitem" data-step="4">🗓 Monthly pages</button><button class="navitem" data-step="5">✨ Firsts</button><button class="navitem" data-step="6">💌 A letter</button><div class="progress"><strong>Book progress</strong><div class="progressbar"><span id="progressFill" style="width:14%"></span></div><div class="status" id="progressText">1 of 7 sections</div></div><div style="margin-top:14px" class="note">Your draft is kept in this browser. Photos stay on your device until you export the book.</div></aside><main class="main" id="main"></main></div></div><div class="modal" id="modal"><div class="modal-card"><div style="display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:14px"><div><div class="eyebrow">Preview</div><h2 style="margin-bottom:0">Your first-year memory book</h2></div><div style="display:flex;gap:8px"><button class="btn" id="closePreview">Close</button><button class="btn primary" id="printBook">Print / save PDF</button></div></div><div class="book" id="bookPreview"></div></div></div><input type="file" id="photoInput" accept="image/*" multiple class="hide"><script>
const state={baby:{name:'',dob:'',time:'',weight:'',length:'',place:'',story:''},arrival:{pregnancy:'',nursery:'',excited:'',arrivalPhoto:null,birthPhoto:null},memories:[],months:Array.from({length:12},(_,i)=>({month:i+1,notes:'',favourite:'',newthing:''})),firsts:[['First smile',''],['First laugh',''],['First bath',''],['First outing',''],['First food',''],['First tooth',''],['First crawl',''],['First steps',''],['First word',''],['First Christmas',''],['First birthday','']],letter:''};
let step=0;const $=s=>document.querySelector(s), esc=s=>String(s||'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));
function save(){localStorage.setItem('babykit',JSON.stringify(state));const btn=$('#saveBtn');btn.textContent='Saved ✓';setTimeout(()=>btn.textContent='Save on this device',1200)}
function load(){try{const x=JSON.parse(localStorage.getItem('babykit'));if(x)Object.assign(state,x)}catch{} }
function nav(){document.querySelectorAll('.navitem').forEach(b=>b.classList.toggle('active',+b.dataset.step===step));$('#progressFill').style.width=((step+1)/7*100)+'%';$('#progressText').textContent=(step+1)+' of 7 sections';render()}
function field(label,key,value,type='text',extra=''){return `<div class="field"><label>${label}</label><input data-key="${key}" type="${type}" value="${esc(value)}" ${extra}></div>`}
function render(){const m=$('#main');if(step===0)m.innerHTML=`<section class="hero"><div><div class="eyebrow">A keepsake, not a spreadsheet</div><h1>Your baby's first year, beautifully remembered.</h1><p>Build a private memory book in your browser. Add photos, little stories and firsts, then print or save your finished book as a PDF.</p><button class="btn primary" id="startBtn">Start my book</button></div><div class="cover-preview"><div class="cover-photo" id="heroPhoto">Add a baby photo later</div><div><div class="cover-name">${esc(state.baby.name||'Your Baby')}</div><div>My First Year</div></div></div></section><section class="section"><h2>Designed for real memories</h2><div class="grid3"><div><h3>12 monthly pages</h3><p class="note">A simple place for each month's favourite moments, new skills and photos.</p></div><div><h3>Firsts that matter</h3><p class="note">Keep the big and tiny milestones together in one timeline.</p></div><div><h3>Private by default</h3><p class="note">Your draft and photos stay in this browser unless you choose to export them.</p></div></div></section>`;else if(step===1)m.innerHTML=`<section class="section"><div class="eyebrow">Step 1</div><h2>Tell us about your baby</h2><p class="note">These details become your cover and arrival page.</p><div class="grid2">${field('Baby name','baby.name',state.baby.name)}${field('Date of birth','baby.dob',state.baby.dob,'date')}${field('Time of birth','baby.time',state.baby.time,'time')}${field('Birth weight','baby.weight',state.baby.weight,'text','placeholder="e.g. 3.5 kg"')}${field('Length','baby.length',state.baby.length,'text','placeholder="e.g. 51 cm"')}${field('Place of birth','baby.place',state.baby.place)}</div><div class="field" style="margin-top:16px"><label>Birth story</label><textarea data-key="baby.story" placeholder="What do you remember most about the day?"></textarea></div><div class="book-actions"><button class="btn" id="prevBtn">Back</button><button class="btn primary" id="nextBtn">Save & continue</button></div></section>`;else if(step===2)m.innerHTML=`<section class="section"><div class="eyebrow">Step 2</div><h2>Before you arrived</h2><div class="grid2"><div class="field"><label>The pregnancy announcement</label><textarea data-key="arrival.pregnancy" placeholder="How did we tell everyone?"></textarea></div><div class="field"><label>Preparing your nursery</label><textarea data-key="arrival.nursery" placeholder="What did we choose for your room?"></textarea></div><div class="field"><label>What we were most excited about</label><textarea data-key="arrival.excited" placeholder="The things we couldn't wait to see, hear or do..."></textarea></div></div><div class="book-actions"><button class="btn" id="prevBtn">Back</button><button class="btn primary" id="nextBtn">Continue</button></div></section>`;else if(step===3)m.innerHTML=`<section class="section"><div class="eyebrow">Step 3</div><h2>Photos & favourite memories</h2><p class="note">Add the photos you want in your book. Nothing is uploaded anywhere.</p><div class="photo-drop" id="drop"><strong>Choose photos</strong><div class="note" style="margin-top:4px">You can select several at once.</div><button class="btn soft" id="choosePhotos" style="margin-top:12px">Add photos</button></div><div class="photo-grid" id="photos"></div><div class="book-actions"><button class="btn" id="prevBtn">Back</button><button class="btn primary" id="nextBtn">Continue</button></div></section>`;else if(step===4)m.innerHTML=`<section class="section"><div class="eyebrow">Step 4</div><h2>Your first 12 months</h2><div class="months">${state.months.map((x,i)=>`<div class="month-card"><span class="tag">Month ${i+1}</span><h4>Little moments</h4><div class="field"><label>Favourite thing</label><input data-month="${i}" data-part="favourite" value="${esc(x.favourite)}" placeholder="e.g. bath time"></div><div class="field" style="margin-top:9px"><label>New thing you did</label><input data-month="${i}" data-part="newthing" value="${esc(x.newthing)}" placeholder="e.g. sat up"></div><div class="field" style="margin-top:9px"><label>Our memory</label><textarea data-month="${i}" data-part="notes" style="min-height:90px" placeholder="A tiny story worth remembering">${esc(x.notes)}</textarea></div></div>`).join('')}</div><div class="book-actions"><button class="btn" id="prevBtn">Back</button><button class="btn primary" id="nextBtn">Continue</button></div></section>`;else if(step===5)m.innerHTML=`<section class="section"><div class="eyebrow">Step 5</div><h2>Your firsts</h2><div class="firsts">${state.firsts.map((f,i)=>`<div class="first"><div class="first-row"><strong>${esc(f[0])}</strong><button class="check ${f[1]?'on':''}" data-first="${i}" aria-label="mark done"></button></div><input style="width:100%;margin-top:12px" data-first-text="${i}" value="${esc(f[1])}" placeholder="Date or little note"></div>`).join('')}</div><div class="book-actions"><button class="btn" id="prevBtn">Back</button><button class="btn primary" id="nextBtn">Continue</button></div></section>`;else if(step===6)m.innerHTML=`<section class="section"><div class="eyebrow">Final step</div><h2>A letter to your future self</h2><p class="note">Write a few words for your baby's first birthday. There is no right way to do this.</p><div class="field"><label>Your letter</label><textarea data-key="letter" style="min-height:280px" placeholder="Dear ${esc(state.baby.name||'little one')}, ...">${esc(state.letter)}</textarea></div><div class="book-actions"><button class="btn" id="prevBtn">Back</button><button class="btn primary" id="previewBtn2">Preview my book</button></div></section>`;bind();}
function bind(){mInputs();$('#startBtn')?.addEventListener('click',()=>{step=1;nav()});$('#prevBtn')?.addEventListener('click',()=>{step=Math.max(0,step-1);nav()});$('#nextBtn')?.addEventListener('click',()=>{save();step=Math.min(6,step+1);nav()});$('#previewBtn2')?.addEventListener('click',()=>openPreview());$('#choosePhotos')?.addEventListener('click',()=>$('#photoInput').click());renderPhotos();document.querySelectorAll('[data-first]').forEach(b=>b.addEventListener('click',()=>{const i=+b.dataset.first;b.classList.toggle('on');if(!b.classList.contains('on'))state.firsts[i][1]=''}));document.querySelectorAll('[data-first-text]').forEach(inp=>inp.addEventListener('input',()=>state.firsts[+inp.dataset.firstText][1]=inp.value));}
function mInputs(){document.querySelectorAll('[data-key]').forEach(inp=>{const path=inp.dataset.key.split('.');let obj=state;for(let i=0;i<path.length-1;i++)obj=obj[path[i]];const last=path[path.length-1];if(inp.tagName==='TEXTAREA'&&inp.value==='')inp.value=obj[last]||'';inp.addEventListener('input',()=>{obj[last]=inp.value})});document.querySelectorAll('[data-month]').forEach(inp=>inp.addEventListener('input',()=>state.months[+inp.dataset.month][inp.dataset.part]=inp.value));}
function renderPhotos(){const p=$('#photos');if(!p)return;p.innerHTML=state.memories.map((x,i)=>`<div class="thumb"><img src="${x.data}" alt="memory photo"><button data-remove="${i}">×</button></div>`).join('');p.querySelectorAll('[data-remove]').forEach(b=>b.onclick=()=>{state.memories.splice(+b.dataset.remove,1);renderPhotos();});}
$('#photoInput').addEventListener('change',e=>{[...e.target.files].forEach(file=>{const r=new FileReader();r.onload=()=>{state.memories.push({data:r.result,name:file.name});renderPhotos()};r.readAsDataURL(file)});e.target.value=''});
function openPreview(){save();$('#bookPreview').innerHTML=buildBook();$('#modal').classList.add('show')}
function buildBook(){const name=esc(state.baby.name||'Your Baby');const photos=state.memories.map(x=>`<div class="memory-small"><img src="${x.data}" alt=""></div>`);let html=`<div class="page cover"><div class="cover-inner"><div style="letter-spacing:.12em;text-transform:uppercase;font-size:12px">BabyKit presents</div><div class="memory-photo">${state.memories[0]?`<img src="${state.memories[0].data}" alt="">`:'Add your favourite photo here'}</div><div style="font-family:'Playfair Display',serif;font-size:56px">${name}</div><div style="font-size:18px;margin-top:10px">My First Year</div></div><div class="page-no">1</div></div>`;
html+=`<div class="page"><div class="eyebrow">Your arrival</div><h2>The day you came into our world</h2><div class="split"><div><p><strong>Date</strong><br>${esc(state.baby.dob||'Not added')}</p><p><strong>Time</strong><br>${esc(state.baby.time||'Not added')}</p><p><strong>Weight</strong><br>${esc(state.baby.weight||'Not added')}</p></div><div><p><strong>Length</strong><br>${esc(state.baby.length||'Not added')}</p><p><strong>Place</strong><br>${esc(state.baby.place||'Not added')}</p></div></div><h3>Birth story</h3><p class="little">${esc(state.baby.story||'Add the story you want to remember here.')}</p><h3>Before you arrived</h3><p class="quote">${esc(state.arrival.excited||'We could not wait to meet you.')}</p><div class="page-no">2</div></div>`;
for(let i=0;i<12;i++){const m=state.months[i];html+=`<div class="page"><div class="eyebrow">Month ${i+1}</div><h2>${name}, at ${i+1} month${i?'s':''}</h2><div class="monthpage"><div>${photos[i]?photos[i]:`<div class="memory-small">A favourite photo from this month</div>`}${photos[i+1]?photos[i+1]:''}</div><div><h3>Favourite thing</h3><p class="little">${esc(m.favourite||'Add a favourite.')}</p><h3>New thing you did</h3><p class="little">${esc(m.newthing||'Add a new skill.')}</p><h3>Our memory</h3><p class="little">${esc(m.notes||'Add a little story from this month.')}</p></div></div><div class="page-no">${i+3}</div></div>`}
html+=`<div class="page"><div class="eyebrow">Milestones</div><h2>Your firsts</h2><div class="firsts" style="margin-top:20px">${state.firsts.map(f=>`<div class="first"><strong>${esc(f[0])}</strong><div class="status" style="margin-top:7px">${esc(f[1]||'Not added yet')}</div></div>`).join('')}</div><div class="page-no">15</div></div>`;
html+=`<div class="page"><div class="eyebrow">One year</div><h2>A letter to you</h2><p class="little" style="font-size:18px;white-space:pre-wrap;line-height:1.8">${esc(state.letter||`Dear ${state.baby.name||'little one'},\n\nWrite your first-birthday letter here.\n\nLove,\nYour family`)}</p><div class="page-no">16</div></div>`;return html}
$('#saveBtn').onclick=save;$('#previewBtn').onclick=openPreview;$('#closePreview').onclick=()=>$('#modal').classList.remove('show');$('#printBook').onclick=()=>window.print();document.querySelectorAll('.navitem').forEach(b=>b.addEventListener('click',()=>{step=+b.dataset.step;nav()}));load();nav();
</script></body></html>
